<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FastTrack Music</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f6f8;font:16px system-ui,sans-serif;line-height:1.55}button{font:inherit;cursor:pointer}
aside{position:fixed;width:240px;top:0;bottom:0;background:#11151b;border-right:1px solid #29313c;padding:18px;z-index:5}.logo{font-size:22px;font-weight:800;margin:4px 8px 22px}.logo span{color:#8ab4ff}
nav button{width:100%;text-align:left;border:0;background:transparent;color:#aeb7c4;padding:11px;border-radius:9px;margin:2px 0}nav button.active,nav button:hover{background:#202732;color:#fff}
main{margin-left:240px;padding:28px;max-width:1200px}.eyebrow{color:#8ab4ff;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.muted{color:#aeb7c4}
h1{font-size:clamp(34px,6vw,60px);line-height:1.05;margin:8px 0 15px}h2{margin-top:28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card,.lesson,.box{background:#151a22;border:1px solid #2a3340;border-radius:13px;padding:18px}.lesson{display:flex;justify-content:space-between;gap:15px;margin:9px 0;cursor:pointer}.lesson:hover{border-color:#56657a}.lesson.done{border-color:#3d7654}.tag{font-size:12px;border:1px solid #394452;border-radius:99px;padding:3px 8px;white-space:nowrap;color:#aeb7c4}.btn{background:#202732;color:white;border:1px solid #394452;border-radius:9px;padding:10px 14px}.primary{background:#8ab4ff;color:#07101b;border-color:#8ab4ff;font-weight:800}.practice{background:#080a0d;border:1px solid #2a3340;border-radius:9px;padding:16px;white-space:pre-wrap;font-family:monospace;overflow:auto}.callout{border-left:3px solid #8ab4ff;background:#111721;padding:12px 15px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.answer{background:#202732;color:#fff;border:1px solid #394452;border-radius:9px;padding:13px;text-align:left}.answer.correct{background:#143021;border-color:#64d99a}.answer.wrong{background:#321719;border-color:#ff7474}.feedback{min-height:28px;font-weight:800;margin:12px 0}.quizdisplay{white-space:pre;background:#080a0d;border:1px solid #2a3340;border-radius:9px;padding:18px;font:18px monospace;overflow:auto}.bar{height:8px;background:#29313c;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#8ab4ff}.big{font-size:34px;font-weight:850}.mobile{display:none}
@media(max-width:800px){aside{display:none}main{margin:0;padding:20px 15px 80px}.grid,.grid3{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#11151b;border-top:1px solid #29313c;z-index:10;justify-content:space-around;padding:8px}.mobile button{background:none;border:0;color:#aeb7c4;font-size:11px}.mobile button.active{color:#fff}}
</style></head><body>
<aside><div class="logo">Fast<span>Track</span> Music</div><nav id="nav">
<button data-p="home">Dashboard</button><button data-p="guitar">🎸 Guitar Course</button><button data-p="piano">🎹 Piano Course</button><button data-p="tab">📖 TAB Academy</button><button data-p="reading">🎼 Piano Reading</button><button data-p="practice">⏱ Practice</button></nav></aside>
<main id="app"></main><div class="mobile" id="mnav"></div>
<script>
const G=[
["g1","Guitar setup & tuning","Foundation",`<h2>What you need to know</h2><p>Standard guitar tuning from thickest to thinnest is <b>E A D G B e</b>. The thickest string is the low E. Frets are the spaces between the metal fret wires.</p><div class="callout"><b>Skill check:</b> You should be able to point to any string and say its name without counting.</div><h2>Practice</h2><div class="practice">Touch each string: E → A → D → G → B → e.\nPick each open string slowly.\nTune before every practice session.</div>`],
["g2","Reading guitar TAB","TAB",`<h2>How TAB works</h2><p>Six horizontal lines represent the six strings. Numbers tell you which fret to play. <b>0</b> means open string. Read from left to right.</p><div class="practice">e|----------------|\nB|----------------|\nG|----------------|\nD|-----2----------|\nA|--3-----0-------|\nE|----------------|</div><p>When numbers line up vertically, play them together. That is how TAB shows a chord or simultaneous notes.</p>`],
["g3","First open chords","Chords",`<h2>Start small</h2><p>Learn <b>Em, Am, C, G and D</b> first. Five clean chords are more useful than twenty sloppy ones.</p><div class="practice">Em: 022000\nAm: x02210\nC:  x32010\nG:  320003\nD:  xx0232</div><p>x means do not play that string.</p>`],
["g4","Chord changes","Technique",`<p>Practice two chords at a time. Form the first chord, strum once, release, form the second chord, strum once.</p><div class="practice">Em ↔ G\nG ↔ C\nC ↔ D\nAm ↔ C\n\nStart slowly. Your target is clean changes, not frantic changes.</div>`],
["g5","Rhythm & strumming","Rhythm",`<h2>Count evenly</h2><p>Use a metronome. First play four downstrokes per bar, then alternate down/up strokes.</p><div class="practice">1 & 2 & 3 & 4 &\n↓   ↓   ↓   ↓\n\n1 & 2 & 3 & 4 &\n↓ ↑ ↓ ↑ ↓ ↑ ↓ ↑</div>`],
["g6","Play a simple song","Application",`<p>Pick a beginner song that uses chords you already know. Your first goal is to play through the section without stopping.</p><div class="callout">Do not restart every time you make a mistake. Keep the beat and recover on the next chord.</div>`],
["g7","A, E and D minor","Chords",`<p>Add <b>A, E and Dm</b>. Use them immediately in progressions rather than memorizing them in isolation.</p><div class="practice">A → D → E\nAm → Dm → E\nC → Am → Dm → G</div>`],
["g8","Power chords & muting","Technique",`<p>Power chords are movable root-and-fifth shapes. Practice clean movement between frets. Add light palm muting while keeping the pulse even.</p>`],
["g9","Single-note TAB","TAB",`<p>Read a short phrase without stopping to translate every number.</p><div class="practice">e|----------------|\nB|--1--3--5--3--1-|\nG|----------------|\nD|----------------|\nA|----------------|\nE|----------------|</div>`],
["g10","Hammer-ons & pull-offs","Technique",`<div class="practice">e|--5h7--7p5--|\n\nh = hammer-on\np = pull-off</div><p>Use the fretting hand to create the second note. Keep both notes clear and even.</p>`],
["g11","Slides, bends & vibrato","Technique",`<div class="practice">e|--5/7--7\\5--|\nB|--7b9--7~---|\n\n/ slide up   \\ slide down\nb bend        ~ vibrato</div>`],
["g12","Barre chords","Chords",`<p>Learn a movable barre shape gradually. Isolate the strings that buzz, fix them, then put the shape into a progression.</p>`],
["g13","Minor pentatonic","Lead",`<p>Learn the minor pentatonic shape and immediately use it over a simple backing track. This is your first practical map for lead playing.</p>`],
["g14","Major scale basics","Theory",`<p>Understand whole and half steps and how scales create melodies and chords. Think in relationships rather than isolated shapes.</p>`],
["g15","Arpeggios & fingerstyle","Technique",`<p>Turn chord shapes into individual notes. Start with simple thumb-and-finger patterns and keep the rhythm steady.</p>`]
];
const P=[
["p1","Keyboard map & posture","Foundation",`<p>The pattern of two and three black keys is your map. Every <b>C</b> is immediately left of a group of two black keys.</p><div class="callout">Do not look for every note by counting from C. Train landmarks.</div>`],
["p2","Rhythm fundamentals","Foundation",`<p>Count before playing. Learn beats versus subdivisions and clap rhythms before putting them on the keyboard.</p><div class="practice">1 2 3 4\n♩ ♩ ♩ ♩\n\n1 & 2 & 3 & 4 &\n♪ ♪ ♪ ♪ ♪ ♪ ♪ ♪</div>`],
["p3","Major triads","Chords",`<div class="practice">C major = C E G\nF major = F A C\nG major = G B D</div><p>Root + major third + perfect fifth. Learn both the shape and sound.</p>`],
["p4","Minor triads","Chords",`<div class="practice">A minor = A C E\nE minor = E G B\nD minor = D F A</div><p>Compare major and minor by listening to the third.</p>`],
["p5","Chord progressions","Application",`<div class="practice">C → G → Am → F\nC → F → G → C</div><p>Keep the hands close and the pulse steady.</p>`],
["p6","Melody + chords","Technique",`<p>Left hand plays a simple bass note or chord while right hand plays a melody. Start slowly and add complexity one part at a time.</p>`],
["p7","Chord inversions","Chords",`<p>Inversions reduce hand movement. Practice C–F–G using the closest available inversion instead of jumping back to root position.</p>`],
["p8","C, G & F scales","Technique",`<p>Learn correct fingering slowly. Then use scales as warmups and as a way to understand which notes belong to a key.</p>`],
["p9","Arpeggios","Technique",`<p>Play triad notes individually ascending and descending. Keep the rhythm even and your hand relaxed.</p>`],
["p10","Seventh chords","Chords",`<div class="practice">Cmaj7 = C E G B\nAm7 = A C E G\nG7 = G B D F</div>`],
["p11","Chord charts & lead sheets","Reading",`<p>Learn to see a chord symbol and immediately know a basic voicing. This is one of the fastest routes to accompanying songs.</p>`],
["p12","Two-hand independence","Technique",`<p>Start with a repeating left-hand pattern and a simple right-hand rhythm. Change one variable at a time.</p>`],
["p13","Playing by ear","Ear",`<p>Find short melodies by listening and locate them on the keyboard. Ear training makes reading more useful rather than replacing it.</p>`],
["p14","Transposition","Theory",`<p>Move a familiar progression to another key. Think in intervals and chord relationships instead of memorizing every key separately.</p>`]
];

const tabLevels=[
["String & fret","Identify the string and fret of a generated TAB note."],
["Fret recognition","Recognize fret numbers rapidly."],
["Sequences","Read multiple TAB notes in order."],
["Rhythm","Interpret timing and subdivisions in TAB."],
["Techniques","Understand h, p, /, b, ~ and palm-muting marks."],
["Chords","Read simultaneous TAB notes."],
["Riffs","Read longer mixed phrases."],
["Fluency","Mixed timed recognition after accuracy is established."]
];
const readLevels=[
["Keyboard notes","Recognize notes and their keyboard locations."],
["Treble clef","Read treble staff notes."],
["Bass clef","Read bass staff notes."],
["Both clefs","Switch randomly between treble and bass."],
["Intervals","Recognize interval sizes."],
["Rhythm","Recognize note values and rests."],
["Melody reading","Read short note sequences."],
["Chord reading","Recognize chord names and inversions."],
["Two-hand reading","Combine treble and bass information."],
["Sight-reading fluency","Mixed timed reading."]
];
let S=JSON.parse(localStorage.getItem("ft_fixed")||'{"g":[],"p":[],"tab":{"a":0,"c":0},"read":{"a":0,"c":0}}');
function save(){localStorage.setItem("ft_fixed",JSON.stringify(S))}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function complete(id,t){return S[t].includes(id)}
function pct(arr,t){return Math.round(S[t].length/arr.length*100)}
function course(arr,t,title){return `<div class="eyebrow">${title}</div><h1>Learn it. Practice it. Use it.</h1><p class="muted">This is the core course—not a collection of empty videos. Each lesson gives you a concept, a drill and a performance target.</p><div class="card"><div class="big">${pct(arr,t)}%</div><div class="bar"><i style="width:${pct(arr,t)}%"></i></div></div>${arr.map((x,i)=>`<div class="lesson ${complete(x[0],t)?"done":""}" onclick="openLesson('${x[0]}','${t}')"><div><b>${i+1}. ${x[1]}</b><small class="muted">${x[2]}</small></div><span class="tag">${complete(x[0],t)?"✓ Complete":x[2]}</span></div>`).join("")}`}
function openLesson(id,t){let arr=t==="g"?G:P,x=arr.find(a=>a[0]===id);app.innerHTML=`<button class="btn" onclick="render('${t==="g"?"guitar":"piano"}')">← Back</button><div class="eyebrow" style="margin-top:20px">${x[2]}</div><h1>${x[1]}</h1><div class="card">${x[3]}</div><div class="box"><h2>Performance check</h2><p>Before marking complete, make sure you can:</p><label><input type=checkbox> Explain the concept.</label><br><label><input type=checkbox> Perform it slowly and correctly.</label><br><label><input type=checkbox> Repeat it without stopping.</label><br><button class="btn primary" style="margin-top:15px" onclick="toggleDone('${id}','${t}')">${complete(id,t)?"Mark incomplete":"Mark complete"}</button></div>`}
function toggleDone(id,t){let a=S[t],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();render(t==="g"?"guitar":"piano")}
function home(){return `<div class="eyebrow">FastTrack Music</div><h1>Guitar & piano, learned properly.</h1><p class="muted">A beginner-friendly curriculum built around real skill: lessons → deliberate practice → reading → songs → fluency.</p><div class="grid"><div class="card"><h2>🎸 Guitar</h2><div class="big">${pct(G,"g")}%</div><button class="btn primary" onclick="render('guitar')">Open course</button></div><div class="card"><h2>🎹 Piano</h2><div class="big">${pct(P,"p")}%</div><button class="btn primary" onclick="render('piano')">Open course</button></div></div><div class="grid" style="margin-top:14px"><div class="card"><h2>📖 Guitar TAB</h2><p class="muted">${S.tab.a?Math.round(S.tab.c/S.tab.a*100):0}% accuracy · ${S.tab.c}/${S.tab.a}</p><button class="btn primary" onclick="render('tab')">Train</button></div><div class="card"><h2>🎼 Piano Reading</h2><p class="muted">${S.read.a?Math.round(S.read.c/S.read.a*100):0}% accuracy · ${S.read.c}/${S.read.a}</p><button class="btn primary" onclick="render('reading')">Train</button></div></div>`}
function tabAcademy(){return `<div class="eyebrow">Guitar TAB Academy</div><h1>Master TAB through repetition.</h1><p class="muted">Every question is generated fresh. You are training recognition, not memorizing a fixed answer key.</p><div class="grid2">${tabLevels.map((x,i)=>`<div class="card"><div class="eyebrow">Level ${i+1}</div><h2>${x[0]}</h2><p class="muted">${x[1]}</p><button class="btn primary" onclick="startQuiz('tab',${i})">Start</button></div>`).join("")}</div>`}
function readingAcademy(){return `<div class="eyebrow">Piano Reading Academy</div><h1>Make reading automatic.</h1><p class="muted">Keyboard notes → treble → bass → intervals → rhythm → chords → two-hand reading → fluency.</p><div class="grid2">${readLevels.map((x,i)=>`<div class="card"><div class="eyebrow">Level ${i+1}</div><h2>${x[0]}</h2><p class="muted">${x[1]}</p><button class="btn primary" onclick="startQuiz('read',${i})">Start</button></div>`).join("")}</div>`}
const TREBLE=["C4","D4","E4","F4","G4","A4","B4","C5","D5","E5","F5","G5","A5","B5","C6"],BASS=["C2","D2","E2","F2","G2","A2","B2","C3","D3","E3","F3","G3","A3","B3","C4"],STR=["e","B","G","D","A","E"];
let Q={kind:"tab",level:0,q:null,num:0,c:0,answered:false};
function makeTab(){let n=Array.from({length:Math.max(1,Math.min(7,Q.level+1))},()=>({s:Math.floor(Math.random()*6),f:Math.floor(Math.random()*18)}));let rows=STR.map(s=>s+"|");n.forEach((x,i)=>rows[x.s]+="-".repeat(2+i*2)+x.f);rows=rows.map(x=>x.padEnd(24,"-")+"|");return {n,txt:rows.join("\n")}}
function makeQuestion(){if(Q.kind==="tab"){let t=makeTab(),x=t.n[0];if(Q.level===0)return {display:t.txt,q:"Which string is the first note on?",c:STR[x.s],a:shuffle([...STR])};if(Q.level===1)return {display:t.txt,q:"What fret is the first note?",c:String(x.f),a:shuffle([String(x.f),String((x.f+2)%18),String((x.f+5)%18),String((x.f+9)%18)])};if(Q.level===2){let c=t.n.slice(0,3).map(x=>STR[x.s]+":"+x.f).join(" → ");return {display:t.txt,q:"Which sequence matches the first three notes?",c,a:shuffle([c,"e:0 → B:1 → G:2","A:2 → D:4 → G:5","e:3 → B:5 → G:7"])}}let marks=[["h","hammer-on"],["p","pull-off"],["/","slide"],["b","bend"],["~","vibrato"]],m=marks[Math.floor(Math.random()*marks.length)];return {display:t.txt+"\n\nMarker: "+m[0],q:"What does this TAB marker mean?",c:m[1],a:shuffle([m[1],...marks.filter(v=>v!==m).slice(0,3).map(v=>v[1])])}}let l=Q.level;if(l===0){let n=["C","D","E","F","G","A","B"][Math.floor(Math.random()*7)]+(3+Math.floor(Math.random()*3));return {display:"Keyboard note: "+n,q:"What note is shown?",c:n,a:shuffle([n,...["C","D","E","F","G","A","B"].filter(x=>x!==n[0]).slice(0,3).map(x=>x+n[1])])}}let pool=l===2?BASS:TREBLE,clef=l===1?"Treble":l===2?"Bass":Math.random()>.5?"Treble":"Bass",n=pool[Math.floor(Math.random()*pool.length)];if(l<=3)return {display:clef+" clef\n\n──────────────\n    ●\n──────────────\n\nNote position: "+n,q:"Which note is shown?",c:n,a:shuffle([n,...pool.filter(x=>x!==n).slice(0,3)])};if(l===4){let z=["2nd","3rd","4th","5th","6th","7th","octave"],c=z[Math.floor(Math.random()*z.length)];return {display:"C → "+({"2nd":"D","3rd":"E","4th":"F","5th":"G","6th":"A","7th":"B","octave":"C"}[c]),q:"What interval is shown?",c,a:shuffle([c,...z.filter(x=>x!==c).slice(0,3)])}}if(l===5){let z=["quarter note","half note","whole note","eighth notes","rest"],c=z[Math.floor(Math.random()*z.length)];return {display:"♩ ♪ ♪ ♩ 𝄽",q:"Which rhythm value/concept is being tested?",c,a:shuffle([c,...z.filter(x=>x!==c).slice(0,3)])}}if(l===6){let a=TREBLE[Math.floor(Math.random()*TREBLE.length)],b=TREBLE[Math.floor(Math.random()*TREBLE.length)],c=a+" → "+b;return {display:"Treble: "+a+" → "+b,q:"Which sequence is shown?",c,a:shuffle([c,"C4 → E4","D4 → G4","G4 → C5"])}}let cs=["C major","G major","F major","A minor","E minor","D minor","C major 1st inversion"],c=cs[Math.floor(Math.random()*cs.length)];return {display:"Chord symbol / voicing",q:"Which chord is shown?",c,a:shuffle([c,...cs.filter(x=>x!==c).slice(0,3)])}}
function startQuiz(kind,l){Q={kind,level:l,q:null,num:0,c:0,answered:false};render("quiz")}
function quizPage(){if(!Q.q)Q.q=makeQuestion();let q=Q.q;return `<button class="btn" onclick="render('${Q.kind==="tab"?"tab":"reading"}')">← Back</button><div class="eyebrow" style="margin-top:20px">${Q.kind==="tab"?"Guitar TAB":"Piano Reading"} · Level ${Q.level+1}</div><h1>Generated quiz</h1><p class="muted">Question ${Q.num+1} · Session score ${Q.c}/${Q.num}</p><div class="card"><h2>${q.q}</h2><div class="quizdisplay">${q.display}</div><div class="answers">${q.a.map(x=>`<button class="answer" onclick="answer(this,${JSON.stringify(x)})">${x}</button>`).join("")}</div><div id="fb" class="feedback"></div><button id="nx" class="btn primary" disabled onclick="nextQ()">Next →</button></div>`}
function answer(el,a){if(Q.answered)return;Q.answered=true;let ok=a===Q.q.c;Q.num++;if(ok)Q.c++;let k=Q.kind==="tab"?"tab":"read";S[k].a++;if(ok)S[k].c++;save();document.querySelectorAll(".answer").forEach(b=>{if(b.textContent===Q.q.c)b.classList.add("correct")});if(!ok)el.classList.add("wrong");fb.textContent=ok?"Correct!":"Correct answer: "+Q.q.c;fb.style.color=ok?"#64d99a":"#ff7474";nx.disabled=false}
function nextQ(){Q.q=null;Q.answered=false;render("quiz")}
function practice(){return `<div class="eyebrow">Practice system</div><h1>Fast progress comes from focused repetition.</h1><div class="grid"><div class="card"><h2>30 min instrument</h2><p>5 min technique · 10 min current lesson · 10 min song · 5 min review.</p></div><div class="card"><h2>10 min reading</h2><p>2 min easy warmup · 6 min generated quiz · 2 min redo mistakes.</p></div></div>`}
function render(p){document.querySelectorAll("[data-p]").forEach(b=>b.classList.toggle("active",b.dataset.p===p));if(p==="home")app.innerHTML=home();else if(p==="guitar")app.innerHTML=course(G,"g","🎸 Guitar Course");else if(p==="piano")app.innerHTML=course(P,"p","🎹 Piano Course");else if(p==="tab")app.innerHTML=tabAcademy();else if(p==="reading")app.innerHTML=readingAcademy();else if(p==="quiz")app.innerHTML=quizPage();else app.innerHTML=practice();scrollTo(0,0)}
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>render(b.dataset.p));render("home");
</script></body></html>
